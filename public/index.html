<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>羽球接龍報名大廳</title>
  <link rel="stylesheet" href="style.css?v=20260625">
</head>
<body>
  <div id="app" class="loading">
    <div class="loader"></div>
    <p id="status-msg">載入中...</p>
    
    <!-- 大廳視圖 (顯示所有場次) -->
    <div id="lobby-view" class="view hidden">
      <header class="lobby-header">
        <div class="header-icon">🐷</div>
        <div class="header-content">
          <div style="display:flex; align-items:center;">
            <h1 id="lobby-title-text" style="margin-bottom:0;">羽球接龍大廳</h1>
            <button id="btn-edit-title" class="btn-icon hidden" style="margin-left:8px; font-size:16px;">✏️</button>
          </div>
          <p>本週臨打名額有限，趕快搶位，跟著小豬一起快樂揮拍吧！</p>
        </div>
      </header>
      
      <div id="games-container" class="games-list">
        <!-- JS 將在這裡生成卡片 -->
      </div>
      
      <div id="no-games-msg" class="hidden empty-state">
        <p>目前沒有開放報名的場次喔！</p>
        <p class="hint">請在 LINE 群組輸入「接龍開始」來建立新場次。</p>
      </div>
    </div>

    <!-- 建立場次視圖 -->
    <div id="create-game-view" class="view hidden">
      <header class="detail-header">
        <button id="btn-cancel-create" class="btn-icon">⬅ 取消</button>
        <h2>建立新場次</h2>
      </header>
      
      <div class="form-container">
        <div class="form-group">
          <label>發布目標群組 (必填)</label>
          <div id="cg-target-gids-container" class="checkbox-group" style="display: flex; flex-direction: column; gap: 8px;">
            <p>載入中...</p>
          </div>
        </div>
        <div class="form-group">
          <label>標題 (選填)</label>
          <input type="text" id="cg-title" placeholder="例如：週二晚間快樂打">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>日期 (必填)</label>
            <input type="date" id="cg-date">
          </div>
          <div class="form-group">
            <label>時間 (必填)</label>
            <div style="display:flex; align-items:center; gap: 5px;">
              <input type="time" id="cg-time-start">
              <span>~</span>
              <input type="time" id="cg-time-end">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>地點 (必填)</label>
          <input type="text" id="cg-loc" list="loc-options" placeholder="輸入或選擇地點">
          <datalist id="loc-options">
            <option value="南港運動中心">
            <option value="內湖運動中心">
            <option value="信義運動中心">
            <option value="松山運動中心">
            <option value="大安運動中心">
            <option value="中正運動中心">
            <option value="中山運動中心">
            <option value="北投運動中心">
            <option value="文山運動中心">
            <option value="士林運動中心">
          </datalist>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>費用 (選填)</label>
            <input type="text" id="cg-fee" placeholder="例如：200">
          </div>
          <div class="form-group">
            <label>標籤 (選填)</label>
            <input type="text" id="cg-tag" placeholder="例如：歡樂場,新手友善">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>人數上限</label>
            <input type="number" id="cg-limit" value="20" min="1">
          </div>
          <div class="form-group">
            <label>候補上限</label>
            <input type="number" id="cg-backup" value="5" min="0">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>發布時間 (選填)</label>
            <input type="datetime-local" id="cg-publish">
          </div>
          <div class="form-group">
            <label>提醒時間 (選填)</label>
            <input type="datetime-local" id="cg-reminder">
          </div>
        </div>
        
        <div class="form-group">
          <label>自定義預設名單 (選填)</label>
          <div style="display: flex; gap: 5px; margin-bottom: 5px;">
            <select id="cg-template-select" style="flex: 1;">
              <option value="">-- 選擇群組範本 --</option>
            </select>
            <button id="btn-save-template" class="btn-secondary" style="padding: 0 10px; font-size: 12px; white-space: nowrap;">儲存為新範本</button>
            <button id="btn-delete-template" class="btn-danger" style="padding: 0 10px; font-size: 12px; white-space: nowrap;">刪除</button>
          </div>
          <textarea id="cg-initial-list" rows="3" placeholder="每行填寫一人，例如：\n王小明(進階)\n陳大媽"></textarea>
        </div>

        <div class="form-group">
          <label>備註 (選填)</label>
          <textarea id="cg-note" rows="3" placeholder="其他注意事項..."></textarea>
        </div>
        <button id="btn-submit-create" class="btn-primary" style="margin-top: 15px;">確認開團</button>
      </div>
    </div>

    <!-- 明細視圖 (單一場次名單) -->
    <div id="detail-view" class="view hidden">
      <header class="detail-header" style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center;">
          <button id="btn-back" class="btn-icon">⬅ 返回</button>
          <h2 id="detail-title" style="margin-left: 10px; margin-bottom: 0;">場次明細</h2>
        </div>
        <div style="display:flex; gap: 5px;">
          <button id="btn-edit-game" class="btn-primary hidden" style="padding: 5px 10px; font-size: 12px; margin: 0; background-color: #2196F3;">編輯</button>
          <button id="btn-close-game" class="btn-danger hidden" style="padding: 5px 10px; font-size: 12px; margin: 0;">結束</button>
        </div>
      </header>
      
      <div class="detail-stats">
        <div class="stat-box">
          <span class="stat-label">已報名</span>
          <span class="stat-value" id="detail-count">0 / 20</span>
        </div>
      </div>

      <div id="detail-list" class="list-container">
        <!-- JS 將在這裡生成名單 -->
      </div>
    </div>

    <!-- 編輯場次視圖 -->
    <div id="edit-game-view" class="view hidden">
      <header class="detail-header">
        <button id="btn-cancel-edit" class="btn-icon">⬅ 取消</button>
        <h2>編輯場次</h2>
      </header>
      
      <div class="form-container">
        <input type="hidden" id="eg-gameId">
        <div class="form-group">
          <label>標題 (選填)</label>
          <input type="text" id="eg-title" placeholder="例如：週二晚間快樂打">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>日期 (必填)</label>
            <input type="date" id="eg-date">
          </div>
          <div class="form-group">
            <label>時間 (必填)</label>
            <div style="display:flex; align-items:center; gap: 5px;">
              <input type="time" id="eg-time-start">
              <span>~</span>
              <input type="time" id="eg-time-end">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>地點 (必填)</label>
          <input type="text" id="eg-loc" list="loc-options" placeholder="輸入或選擇地點">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>費用 (選填)</label>
            <input type="text" id="eg-fee" placeholder="例如：200">
          </div>
          <div class="form-group">
            <label>標籤 (選填)</label>
            <input type="text" id="eg-tag" placeholder="例如：歡樂場,新手友善">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>人數上限</label>
            <input type="number" id="eg-limit" min="1">
          </div>
          <div class="form-group">
            <label>候補上限</label>
            <input type="number" id="eg-backup" min="0">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>發布時間 (選填)</label>
            <input type="datetime-local" id="eg-publish">
          </div>
          <div class="form-group">
            <label>提醒時間 (選填)</label>
            <input type="datetime-local" id="eg-reminder">
          </div>
        </div>
        <div class="form-group">
          <label>備註 (選填)</label>
          <textarea id="eg-note" rows="3" placeholder="其他注意事項..."></textarea>
        </div>
        <button id="btn-submit-edit" class="btn-primary" style="margin-top: 15px;">儲存變更</button>
      </div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="app.js?v=20260625"></script>
</body>
</html>
