<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>羽球接龍報名大廳</title>
  <link rel="stylesheet" href="style.css?v=20260630">
</head>
<body>
  <div id="app" class="loading">
    <div class="loader"></div>
    <p id="status-msg">載入中...</p>
    
    <!-- 大廳視圖 (顯示所有場次) -->
    <div id="lobby-view" class="view hidden">
      <!-- 獨立的管理者開團區塊 -->
      <div id="admin-create-game-container" class="hidden" style="padding: 15px 15px 0 15px;">
        <button class="btn btn-primary" style="width: 100%; background-color: #FF9800; font-weight: bold; border-radius: 12px; font-size: 16px; padding: 12px;" onclick="showCreateGameForm()">
          ➕ 管理者開團
        </button>
      </div>

      <header class="lobby-header">
        <div class="header-icon">🐷</div>
        <div class="header-content">
          <div style="display:flex; align-items:center;">
            <h1 id="lobby-title-text" style="margin-bottom:0;">羽球接龍大廳</h1>
            <button id="btn-edit-title" class="btn-icon hidden" style="margin-left:8px; font-size:16px;" title="編輯大廳標題">✏️</button>
            <button id="btn-lobby-stats" class="btn-icon hidden" style="margin-left:8px; font-size:16px;" title="大廳使用率分析">📊</button>
            <button id="btn-system-logs" class="btn-icon hidden" style="margin-left:8px; font-size:16px;" title="系統錯誤 LOG">📝</button>
            <button id="btn-easter-egg" class="btn-icon hidden" style="margin-left:8px; font-size:16px;" title="彩蛋設定">🎁</button>
          </div>
          <div style="display:flex; align-items:center;">
            <p id="lobby-desc-text" style="margin-bottom:0;">本週臨打名額有限，趕快搶位，跟著小豬一起快樂揮拍吧！</p>
            <button id="btn-edit-desc" class="btn-icon hidden" style="margin-left:8px; font-size:16px;">✏️</button>
          </div>
        </div>
      </header>
      
      <div id="games-container" class="games-list">
        <!-- JS 將在這裡生成卡片 -->
      </div>
      
      <div id="no-games-msg" class="hidden empty-state">
        <p>目前沒有開放報名的場次喔！</p>
        <p class="hint">請在 LINE 群組輸入「接龍開始」來建立新場次。</p>
      </div>
    </div>

    <!-- 建立場次視圖 -->
    <div id="create-game-view" class="view hidden">
      <header class="detail-header">
        <button id="btn-cancel-create" class="btn-icon">⬅ 取消</button>
        <h2>建立新場次</h2>
      </header>
      
      <div class="form-container">
        <div class="form-group">
          <label>發布目標群組 (必填)</label>
          <div style="display:flex; gap:5px; margin-bottom: 10px;">
            <input type="text" id="cg-new-group-code" placeholder="輸入群組代號 (例: 1234)" style="flex: 1;">
            <button id="btn-cg-add-group" type="button" class="btn-secondary" style="white-space: nowrap; padding: 0 10px;">加入</button>
          </div>
          <div id="cg-target-gids-container" class="checkbox-group" style="display: flex; flex-direction: column; gap: 8px;">
            <p>載入中...</p>
          </div>
        </div>
        <div class="form-group">
          <label>標題 (選填)</label>
          <input type="text" id="cg-title" placeholder="例如：週二晚間快樂打">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>日期 (必填)</label>
            <input type="date" id="cg-date">
          </div>
          <div class="form-group">
            <label>時間 (必填)</label>
            <div style="display:flex; align-items:center; gap: 5px;">
              <input type="time" id="cg-time-start">
              <span>~</span>
              <input type="time" id="cg-time-end">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>地點 (必填)</label>
          <input type="text" id="cg-loc" list="loc-options" placeholder="輸入或選擇地點">
          <datalist id="loc-options">
            <option value="南港運動中心">
            <option value="南港高中">
            <option value="玉成國小">
          </datalist>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>費用 (選填)</label>
            <input type="text" id="cg-fee" placeholder="例如：200">
          </div>
          <div class="form-group">
            <label>標籤 (選填)</label>
            <input type="text" id="cg-tag" placeholder="例如：歡樂場,新手友善">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>人數上限</label>
            <input type="number" id="cg-limit" value="20" min="1">
          </div>
          <div class="form-group">
            <label>候補上限</label>
            <input type="number" id="cg-backup" value="5" min="0">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>發布時間 (選填)</label>
            <input type="datetime-local" id="cg-publish">
          </div>
          <div class="form-group">
            <label>提醒時間 (選填)</label>
            <input type="datetime-local" id="cg-reminder">
          </div>
        </div>
        
        <div class="form-group">
          <label>自定義預設名單 (選填)</label>
          <div style="display: flex; gap: 5px; margin-bottom: 5px;">
            <select id="cg-template-select" style="flex: 1;">
              <option value="">-- 選擇群組範本 --</option>
            </select>
            <button id="btn-save-template" class="btn-secondary" style="padding: 0 10px; font-size: 12px; white-space: nowrap;">儲存為新範本</button>
            <button id="btn-delete-template" class="btn-danger" style="padding: 0 10px; font-size: 12px; white-space: nowrap;">刪除</button>
          </div>
          <div id="cg-initial-list-container" style="display:flex; flex-direction:column; gap:5px; margin-bottom:5px;">
            <!-- 動態加入的格子 -->
          </div>
          <button type="button" id="btn-cg-add-row" class="btn-secondary" style="width:100%; margin-top:5px; padding:8px; font-weight:bold;">➕ 新增一格</button>
        </div>

        <div class="form-group">
          <label>備註 (選填)</label>
          <textarea id="cg-note" rows="3" placeholder="其他注意事項..."></textarea>
        </div>
        <button id="btn-submit-create" class="btn-primary" style="margin-top: 15px;">確認開團</button>
      </div>
    </div>

    <!-- 明細視圖 (單一場次名單) -->
    <div id="detail-view" class="view hidden">
      <header class="detail-header" style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center;">
          <button id="btn-back" class="btn-icon">⬅ 返回</button>
          <h2 id="detail-title" style="margin-left: 10px; margin-bottom: 0;">場次明細</h2>
        </div>
        <div style="display:flex; gap: 5px;">
          <button id="btn-copy-list" class="btn-secondary hidden" style="padding: 5px 10px; font-size: 12px; margin: 0; background-color: #4CAF50; color: white; border: none; border-radius: 20px;">複製名單</button>
          <button id="btn-edit-game" class="btn-primary hidden" style="padding: 5px 10px; font-size: 12px; margin: 0; background-color: #2196F3;">編輯</button>
          <button id="btn-close-game" class="btn-danger hidden" style="padding: 5px 10px; font-size: 12px; margin: 0;">結束</button>
        </div>
      </header>
      
      <div class="detail-stats">
        <div class="stat-box">
          <span class="stat-label">已報名</span>
          <span class="stat-value" id="detail-count">0 / 20</span>
        </div>
      </div>

      <div id="detail-list" class="list-container">
        <!-- JS 將在這裡生成名單 -->
      </div>
    </div>

    <!-- 編輯場次視圖 -->
    <div id="edit-game-view" class="view hidden">
      <header class="detail-header">
        <button id="btn-cancel-edit" class="btn-icon">⬅ 取消</button>
        <h2>編輯場次</h2>
      </header>
      
      <div class="form-container">
        <input type="hidden" id="eg-gameId">
        
        <div class="form-group">
          <label>發布目標群組 (必填)</label>
          <div style="display:flex; gap:5px; margin-bottom: 10px;">
            <input type="text" id="eg-new-group-code" placeholder="輸入群組代號 (例: 1234)" style="flex: 1;">
            <button id="btn-eg-add-group" type="button" class="btn-secondary" style="white-space: nowrap; padding: 0 10px;">加入</button>
          </div>
          <div id="eg-target-gids-container" class="checkbox-group" style="display: flex; flex-direction: column; gap: 8px;">
            <p>載入中...</p>
          </div>
        </div>

        <div class="form-group">
          <label>標題 (選填)</label>
          <input type="text" id="eg-title" placeholder="例如：週二晚間快樂打">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>日期 (必填)</label>
            <input type="date" id="eg-date">
          </div>
          <div class="form-group">
            <label>時間 (必填)</label>
            <div style="display:flex; align-items:center; gap: 5px;">
              <input type="time" id="eg-time-start">
              <span>~</span>
              <input type="time" id="eg-time-end">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>地點 (必填)</label>
          <input type="text" id="eg-loc" list="loc-options" placeholder="輸入或選擇地點">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>費用 (選填)</label>
            <input type="text" id="eg-fee" placeholder="例如：200">
          </div>
          <div class="form-group">
            <label>標籤 (選填)</label>
            <input type="text" id="eg-tag" placeholder="例如：歡樂場,新手友善">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>人數上限</label>
            <input type="number" id="eg-limit" min="1">
          </div>
          <div class="form-group">
            <label>候補上限</label>
            <input type="number" id="eg-backup" min="0">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>發布時間 (選填)</label>
            <input type="datetime-local" id="eg-publish">
          </div>
          <div class="form-group">
            <label>提醒時間 (選填)</label>
            <input type="datetime-local" id="eg-reminder">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group" style="display:flex; align-items:center;">
            <input type="checkbox" id="eg-ended" style="width:auto; margin-right:8px; transform:scale(1.2);">
            <label for="eg-ended" style="margin-bottom:0; cursor:pointer;">設定為已結束 (大廳顯示為灰色並置底)</label>
          </div>
        </div>
        <div class="form-group">
          <label>備註 (選填)</label>
          <textarea id="eg-note" rows="3" placeholder="其他注意事項..."></textarea>
        </div>
        <button id="btn-submit-edit" class="btn-primary" style="margin-top: 15px;">儲存變更</button>
      </div>
    </div>
    <!-- 彩蛋設定視圖 (僅管理員) -->
    <div id="easter-egg-settings-view" class="view hidden">
      <header class="detail-header" style="display:flex; justify-content:flex-start; align-items:center;">
        <button id="btn-back-easter-egg" class="btn-icon">⬅ 返回</button>
        <h2 style="margin-left: 10px; margin-bottom: 0;">彩蛋活動設定</h2>
      </header>
      
      <div class="form-container" style="margin-top: 15px;">
        <div class="form-group" style="display:flex; align-items:center;">
          <input type="checkbox" id="ee-enabled" style="width:auto; margin-right:8px; transform:scale(1.2);">
          <label for="ee-enabled" style="margin-bottom:0; cursor:pointer; font-weight:bold;">開啟豬豬彩蛋活動</label>
        </div>
        <div class="form-group">
          <label>中獎顯示字樣</label>
          <input type="text" id="ee-message" placeholder="出示此畫面給Tony可以獲得一條握把布">
        </div>
        <div class="form-group">
          <label>獲得總人數限制</label>
          <input type="number" id="ee-quota" min="1" value="3">
        </div>
        <div class="form-group">
          <label>目前已獲獎人數</label>
          <div style="display:flex; align-items:center; gap: 10px;">
            <span id="ee-winners-count" style="font-size: 18px; font-weight:bold;">0</span> 人
            <button id="btn-clear-winners" class="btn-danger" style="padding: 5px 10px; font-size: 12px; margin: 0;">清空名單 (重新舉辦)</button>
          </div>
          <ul id="ee-winners-list" style="margin-top: 10px; padding-left: 20px; color: #666; font-size: 14px;"></ul>
        </div>
        <button id="btn-save-easter-egg" class="btn-primary" style="margin-top: 15px;">儲存變更</button>
      </div>
    </div>

    <!-- 大廳使用率分析視圖 (僅管理員) -->
    <div id="stats-view" class="view hidden">
      <header class="detail-header" style="display:flex; justify-content:flex-start; align-items:center;">
        <button id="btn-back-stats" class="btn-icon">⬅ 返回</button>
        <h2 style="margin-left: 10px; margin-bottom: 0;">大廳使用率分析</h2>
      </header>
      
      <div id="stats-groups-container" style="margin-top: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px;">
        <!-- JS 動態渲染多群組統計卡片 -->
      </div>
    </div>

    <!-- 系統 LOG 視圖 (僅管理員) -->
    <div id="system-logs-view" class="view hidden">
      <header class="detail-header" style="display:flex; justify-content:flex-start; align-items:center;">
        <button id="btn-back-logs" class="btn-icon">⬅ 返回</button>
        <h2 style="margin-left: 10px; margin-bottom: 0;">系統錯誤 LOG</h2>
      </header>
      
      <div id="system-logs-container" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px;">
        <!-- JS 動態渲染系統錯誤 LOG -->
      </div>
    </div>
  </div>

  <div id="confetti-container" class="hidden"></div>
  
  <div id="easter-egg-modal" class="hidden" style="position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 10000; display:flex; justify-content:center; align-items:center;">
    <div style="background: white; border: 4px solid #FF9800; border-radius: 15px; padding: 30px; text-align: center; max-width: 90%; width: 400px; box-shadow: 0 0 20px rgba(255,152,0,0.5);">
      <h2 style="color: #FF9800; font-size: 28px; margin-bottom: 20px;">🎉 恭喜中獎 🎉</h2>
      <p id="easter-egg-msg" style="font-size: 20px; font-weight: bold; margin: 20px 0; color: #333; line-height: 1.5;"></p>
      <button class="btn-primary" onclick="document.getElementById('easter-egg-modal').classList.add('hidden')" style="margin-top: 15px;">關閉</button>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="app.js?v=20260702-3"></script>
</body>
</html>
